<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown to WordPress Gutenberg Converter</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding: 20px; 
      max-width: 800px; 
      margin: 0 auto; 
      background: #f0f2f5; 
    }
    h2 { color: #1e1e1e; }
    textarea { 
      width: 100%; 
      height: 200px; 
      padding: 12px; 
      box-sizing: border-box; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      font-size: 14px; 
      margin-bottom: 15px; 
      resize: vertical; 
    }
    button { 
      background: #007cba; 
      color: white; 
      border: none; 
      padding: 10px 20px; 
      font-size: 14px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: 600; 
      margin-right: 10px; 
    }
    button:hover { background: #006ba1; }
    .secondary-btn { background: #2271b1; }
    .button-group { margin-bottom: 20px; }
    .status { 
      display: inline-block; 
      font-size: 14px; 
      color: green; 
      font-weight: bold; 
      transition: opacity 0.3s; 
      opacity: 0; 
    }
  </style>
</head>
<body>

  <h2>Markdown to WordPress Gutenberg Converter</h2>
  <p>Paste your markdown below. The app will remove <code>&lt;mark&gt;</code> tags and format the text for standard WordPress blocks.</p>
  
  <textarea id="markdownInput" placeholder="Paste your markdown here..."></textarea>
  
  <div class="button-group">
    <button onclick="processText()">Convert to Gutenberg</button>
    <button class="secondary-btn" id="copyBtn" onclick="copyToClipboard()" style="display:none;">Copy Gutenberg HTML</button>
    <span id="status" class="status">Copied to clipboard!</span>
  </div>
  
  <textarea id="htmlOutput" placeholder="Gutenberg structural HTML will appear here..." readonly style="display:none; background: #fafafa; font-family: monospace;"></textarea>

  <script>
    function convertMarkdownToGutenberg(markdownText) {
      if (!markdownText) return '';
      
      // 1. Remove <mark> and </mark> tags
      let cleaned = markdownText.replace(/<\/?mark>/gi, '');
      
      // 2. Parse Markdown lines into Gutenberg blocks
      let lines = cleaned.split('\n');
      let blocks = [];
      let inList = false;
      let listItems = [];
      
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        
        // Handle empty lines
        if (line === '') {
          if (inList) {
            blocks.push(buildGutenbergList(listItems));
            inList = false;
            listItems = [];
          }
          continue;
        }
        
        // Process Inline formatting (Bold, Italic, Links)
        line = parseInlineMarkdown(line);
        
        // Headings (### Heading)
        if (line.startsWith('#')) {
          if (inList) { 
            blocks.push(buildGutenbergList(listItems)); 
            inList = false; 
            listItems = []; 
          }
          let match = line.match(/^(#{1,6})\s+(.*)$/);
          if (match) {
            let level = match[1].length;
            let text = match[2];
            blocks.push(`<!-- wp:heading {"level":${level}} -->\n<h${level}>${text}</h${level}>\n<!-- /wp:heading -->`);
            continue;
          }
        }
        
        // Unordered Lists (- Item or * Item)
        if (line.startsWith('- ') || line.startsWith('* ')) {
          inList = true;
          listItems.push(line.substring(2));
          continue;
        }
        
        // Standard Paragraph
        if (inList) { 
          blocks.push(buildGutenbergList(listItems)); 
          inList = false; 
          listItems = []; 
        }
        blocks.push(`<!-- wp:paragraph -->\n<p>${line}</p>\n<!-- /wp:paragraph -->`);
      }
      
      // Catch trailing list
      if (inList) { 
        blocks.push(buildGutenbergList(listItems)); 
      }
      
      return blocks.join('\n\n');
    }

    function buildGutenbergList(items) {
      let listHtml = '<!-- wp:list -->\n<ul>\n';
      items.forEach(item => {
        listHtml += `<!-- wp:list-item -->\n<li>${item}</li>\n<!-- /wp:list-item -->\n`;
      });
      listHtml += '</ul>\n<!-- /wp:list -->';
      return listHtml;
    }

    function parseInlineMarkdown(text) {
      console.log('1: ' + text.replace(/<mark[^>]*>([^<]*)<\/mark>/gi, '$1'));
      console.log('2: ' + text
        .replace(/<mark [^>]*>(.*?)<\/mark>/g, '$1')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'));
      console.log('3: ' + text
        .replace(/<mark [^>]*>(.*?)<\/mark>/g, '$1')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') 
        .replace(/\*(.*?)\*/g, '<em>$1</em>'));
      console.log('4: ' + text
        .replace(/<mark [^>]*>(.*?)<\/mark>/g, '$1')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') 
        .replace(/\*(.*?)\*/g, '<em>$1</em>')             
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>'));
      
      return text
        .replace(/<mark[^>]*>([^<]*)<\/mark>/gi, '$1')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') 
        .replace(/\*(.*?)\*/g, '<em>$1</em>')             
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>'); 
    }

    // UI Orchestration functions
    function processText() {
      const markdown = document.getElementById('markdownInput').value;
      const gutenbergHtml = convertMarkdownToGutenberg(markdown);
      
      const output = document.getElementById('htmlOutput');
      output.value = gutenbergHtml;
      output.style.display = 'block';
      document.getElementById('copyBtn').style.display = 'inline-block';
    }

    function copyToClipboard() {
      const outputText = document.getElementById('htmlOutput');
      outputText.select();
      document.execCommand('copy');
      
      const status = document.getElementById('status');
      status.style.opacity = '1';
      setTimeout(() => { status.style.opacity = '0'; }, 2000);
    }
  </script>
</body>
</html>
